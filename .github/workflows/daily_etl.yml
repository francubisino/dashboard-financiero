name: Pipeline Diario de Finanzas Cuantitativas

on:
  schedule:
    # Intento 1: 10:00 UTC (07:00 AM ART) - Martes a Sábado
    - cron: '0 6 * * 2-6'
    
    # Intento 2: 11:00 UTC (08:00 PM ART) - Martes a Sábado (Mediodía)
    - cron: '0 7 * * 2-6'
    
    # Intento 3: 12:00 UTC (09:00 PM ART) - Martes a Sábado (Cierre parcial / tarde)
    - cron: '0 8 * * 2-6'
    
    # Intento 4: 12:00 UTC (11:00 PM ART) - Martes a Sábado (Cierre parcial / tarde)
    - cron: '0 9 * * 2-6'
    
  workflow_dispatch: # Permite la ejecución manual desde la pestaña Actions de GitHub

jobs:
  ejecutar-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias Cuantitativas
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests xlrd openpyxl beautifulsoup4 lxml
      
      - name: Ejecutar Script de Actualización de Cartera
        env:
          # Inyección segura desde los Repository Secrets de GitHub
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: |
          python actualizar_cartera.py

      - name: Persistir Cambios en cartera.xlsm
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cartera.xlsm
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cartera): actualización automática desde boletos [skip ci]" && git push)

      - name: Ejecutar Script de Actualización de Benchmarks
        run: |
          python actualizar_benchmarks.py

      - name: Ejecutar Script ETL Financiero
        run: |
          python etl_script.py

      - name: Persistir Archivos JSON en GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add macro.json data.json cartera.json benchmarks.json
          
          # Realiza commit únicamente si existen cambios detectados en los JSONs
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): actualización automática de datos cuantitativos [skip ci]" && git push)
