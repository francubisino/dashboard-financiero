name: Pipeline Diario de Finanzas Cuantitativas

on:
  schedule:
    # Ejecución automática todos los días a las 00:00 UTC (21:00 hs ART / UTC-3)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite la ejecución manual desde la pestaña Actions de GitHub

jobs:
  ejecutar-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias Cuantitativas
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests xlrd openpyxl

      - name: Ejecutar Script ETL Financiero
        run: |
          python etl_script.py

      - name: Persistir Archivos JSON en GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add macro.json data.json
          
          # Realiza commit únicamente si existen cambios detectados en los JSONs
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): actualización automática de datos cuantitativos [skip ci]" && git push)
