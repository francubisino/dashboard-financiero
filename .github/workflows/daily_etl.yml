name: Pipeline Diario de Finanzas Cuantitativas

on:
  schedule:
    # Ejecución automática a las 21:00 hs ART (UTC-3 -> 00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Permite ejecutar el script manualmente desde la interfaz de GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias Cuantitativas
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests

      - name: Ejecutar Script ETL
        run: |
          python etl_script.py

      - name: Persistir Cambios en GitHub (JSONs)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add macro.json data.json
          
          # Hacer commit solo si existen modificaciones en los archivos de datos
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): actualización automática de datos cuantitativos [skip ci]" && git push)